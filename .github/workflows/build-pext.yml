name: Build .pext

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # UnifiedDownloadManagerApi.dll is not redistributed in this repo (see README).
      # Store it as a base64 repository secret named UDM_API_DLL_BASE64 so CI can build.
      # Absent on forks / PRs from forks: the build is skipped with a notice instead of
      # failing red.
      - name: Restore UDM API assembly
        id: udm
        shell: pwsh
        env:
          UDM_DLL: ${{ secrets.UDM_API_DLL_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UDM_DLL)) {
            Write-Host "::notice::UDM_API_DLL_BASE64 secret not set — skipping build. See README > Building."
            "available=false" >> $env:GITHUB_OUTPUT
          } else {
            New-Item -ItemType Directory -Force -Path lib | Out-Null
            [IO.File]::WriteAllBytes("lib/UnifiedDownloadManagerApi.dll", [Convert]::FromBase64String($env:UDM_DLL))
            Write-Host "Wrote lib/UnifiedDownloadManagerApi.dll"
            "available=true" >> $env:GITHUB_OUTPUT
          }

      - name: Build
        if: steps.udm.outputs.available == 'true'
        run: dotnet build -c Release --nologo

      - name: Read extension version
        if: steps.udm.outputs.available == 'true'
        id: meta
        shell: pwsh
        run: |
          $line = Select-String -Path extension.yaml -Pattern '^Version:\s*(.+)$'
          $version = $line.Matches[0].Groups[1].Value.Trim()
          Write-Host "Extension version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # A .pext is a zip of the extension's build output (manifest + assemblies +
      # resources) with a .pext extension. Playnite installs it by unzipping.
      - name: Package .pext
        if: steps.udm.outputs.available == 'true'
        id: pack
        shell: pwsh
        run: |
          $out = "bin/Release/net462"
          if (-not (Test-Path "$out/extension.yaml")) {
            throw "extension.yaml missing from build output ($out)."
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $name = "ItchioDownloader_$('${{ steps.meta.outputs.version }}').pext"
          Compress-Archive -Path "$out/*" -DestinationPath "dist/$name" -Force
          Write-Host "Packed dist/$name"
          "file=dist/$name" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        if: steps.udm.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

      - name: Attach to release
        if: steps.udm.outputs.available == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.file }}
