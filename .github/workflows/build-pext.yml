name: Build .pext

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # UnifiedDownloadManagerApi.dll is not redistributed in this repo (see README).
      # Store it as a base64 repository secret named UDM_API_DLL_BASE64 so CI can build.
      # Absent on forks / PRs from forks: the build is skipped with a notice instead of
      # failing red.
      - name: Restore UDM API assembly
        id: udm
        shell: pwsh
        env:
          UDM_DLL: ${{ secrets.UDM_API_DLL_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UDM_DLL)) {
            Write-Host "::notice::UDM_API_DLL_BASE64 secret not set — skipping build. See README > Building."
            "available=false" >> $env:GITHUB_OUTPUT
          } else {
            New-Item -ItemType Directory -Force -Path lib | Out-Null
            [IO.File]::WriteAllBytes("lib/UnifiedDownloadManagerApi.dll", [Convert]::FromBase64String($env:UDM_DLL))
            Write-Host "Wrote lib/UnifiedDownloadManagerApi.dll"
            "available=true" >> $env:GITHUB_OUTPUT
          }

      - name: Build
        if: steps.udm.outputs.available == 'true'
        run: dotnet build -c Release --nologo

      # Pack with Playnite's official Toolbox rather than a hand-rolled zip: it
      # validates the manifest and names the .pext as <AddonId>_<version>.pext, the
      # exact form the add-on database and installer.yaml expect. Toolbox ships inside
      # the Playnite portable build, so fetch the latest release and run it from there.
      - name: Package .pext (Playnite Toolbox)
        if: steps.udm.outputs.available == 'true'
        id: pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = "bin/Release/net462"
          if (-not (Test-Path "$out/extension.yaml")) {
            throw "extension.yaml missing from build output ($out)."
          }

          $headers = @{ 'User-Agent' = 'ci'; 'Authorization' = "Bearer $env:GH_TOKEN" }
          $rel = Invoke-RestMethod 'https://api.github.com/repos/JosefNemec/Playnite/releases/latest' -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -match '^Playnite.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find a Playnite portable .zip in the latest release." }
          Write-Host "Playnite portable: $($asset.name)"

          Invoke-WebRequest $asset.browser_download_url -OutFile playnite.zip -Headers @{ 'User-Agent' = 'ci' }
          Expand-Archive playnite.zip -DestinationPath playnite -Force
          $toolbox = Get-ChildItem -Recurse playnite -Filter Toolbox.exe | Select-Object -First 1
          if (-not $toolbox) { throw "Toolbox.exe not found in the Playnite portable build." }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $toolbox.FullName pack $out (Resolve-Path dist).Path
          if ($LASTEXITCODE -ne 0) { throw "Toolbox pack failed with exit code $LASTEXITCODE." }

          $pext = Get-ChildItem dist -Filter *.pext | Select-Object -First 1
          if (-not $pext) { throw "Toolbox produced no .pext." }
          Write-Host "Packed $($pext.Name)"
          "file=dist/$($pext.Name)" >> $env:GITHUB_OUTPUT
          "name=$($pext.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        if: steps.udm.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

      - name: Attach to release
        if: steps.udm.outputs.available == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.file }}
